name: Build Android APK & Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || true
          else
            mkdir -p "$SDK_DIR"
          fi

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extract
            mv /tmp/cmdtools-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "build-tools;36.0.0" >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" >/dev/null || \
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36" >/dev/null || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare debug keystore
        run: |
          DEFAULT_KEYSTORE_B64=""
          if [ ! -f debug.keystore ]; then
            printf "%s" "$DEFAULT_KEYSTORE_B64" | base64 -d > debug.keystore
          fi

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Resolve Release Version & Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="3.2"
          fi
          BASE_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$BASE_CODE" ]; then
            BASE_CODE="10"
          fi

          FINAL_VERSION="$BASE_VERSION"
          FINAL_CODE="$BASE_CODE"
          FINAL_TAG="v${FINAL_VERSION}"

          echo "RESOLVED_VERSION_NAME=${FINAL_VERSION}" >> "$GITHUB_ENV"
          echo "RESOLVED_RELEASE_TAG=${FINAL_TAG}" >> "$GITHUB_ENV"
          echo "Resolved release tag: ${FINAL_TAG} (versionName=${FINAL_VERSION}, versionCode=${FINAL_CODE})"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache -Pandroid.builder.sdkDownload=true --stacktrace

      - name: Prepare negai.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Signed APK not found or empty in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_PATH" negai.apk
          ls -lh negai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: negai-apk
          path: negai.apk

      - name: Create or Update GitHub Release & Upload negai.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ ! -s negai.apk ]; then
            echo "Error: negai.apk is missing before release upload!"
            exit 1
          fi

          TAG="${RESOLVED_RELEASE_TAG:-v3.2}"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_SIZE=$(du -h negai.apk | cut -f1)
          TITLE="negai ${TAG} — Cinema & Anime 4K Player (RU / EN)"

          NOTES=$(printf "### negai %s — Cinema & Anime 4K Player (RU / EN)\n\n[![Get it on Obtainium](https://raw.githubusercontent.com/ImranR98/Obtainium/main/assets/graphics/badge_obtainium.png)](https://apps.obtainium.imranr.dev/redirect?r=obtainium://add/https://github.com/%s)\n\n#### 🇷🇺 Изменения в релизе %s\n- **Умный сброс завершённых серий (≥95%%)**: если серия просмотрена до финала или титров (прогресс ≥95%% или остаток ≤15 с), повторный запуск открывает видео с 00:00 и предотвращает мгновенный переход на следующий эпизод.\n- **Плавность интерфейса 120 Гц**: устранение микрозадержек и лагов при скролле списков серий, папок, торрентов и настроек за счёт асинхронной загрузки превью, стабильных ключей LazyColumn и мемоизации компонентов.\n- **Верхние правые кнопки плеера в стиле Frosted Glass**: кнопки фиксации поворота экрана, замка от случайных нажатий и PiP получили единый стиль матового стекла с градиентным обрамлением, микробликом и объёмной тенью, как у нижней панели таймлайна.\n- **Актуализация пасхальной планетарной модели**: обновлены орбиты и характеристики технологий плеера (Игровой режим Bluetooth, авто-баланс Anime4K+MEMC, детектор озвучек торрентов).\n- **Очистка репозитория**: удалена ошибочная запись из .gitignore и синхронизированы описания функций во всех разделах.\n\n#### 🇬🇧 What's New in Release %s\n- **Smart Restart of Completed Videos (≥95%%)**: episodes watched to ≥95%% (or ending in ≤15s) automatically start at 00:00 when reopened, preventing accidental auto-skipping to the next video.\n- **120Hz Scrolling Smoothness**: eliminated stutter in episode cards, folders, torrents, and settings by switching thumbnail lookups to background IO threads, stabilizing LazyColumn keys, and memoizing gradient brushes.\n- **Frosted Glass Top HUD Buttons**: rotation lock, screen lock, and PiP utility buttons now match the bottom timeline panel with frosted glass tint, gradient borders, and depth elevation.\n- **Updated Planetary Easter Egg**: refreshed orbital specifications with Bluetooth Gaming Mode, Anime4K+MEMC auto-balance, and torrent voiceover parsing.\n- **Repository Polish**: removed invalid gitignore typo and synchronized English/Russian function descriptions across all screens.\n\n---\n- **APK:** \`negai.apk\` (%s)\n- **Build / Commit:** \`#%s\` / \`%s\` (branch \`%s\`)\n- **Direct Download:** [negai.apk](https://github.com/%s/releases/download/%s/negai.apk)" "$TAG" "$GITHUB_REPOSITORY" "$TAG" "$TAG" "$APK_SIZE" "$GITHUB_RUN_NUMBER" "$SHORT_SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$TAG")

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Updating to official full Release (removing pre-release flag)..."
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease=false \
              --draft=false
            gh release upload "$TAG" negai.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating official full GitHub Release $TAG..."
            gh release create "$TAG" negai.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          REL_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)
          echo "Published GitHub Release: $REL_URL"

          {
            echo "## GitHub Release опубликован"
            echo "- **Релиз:** [${TAG}](${REL_URL})"
            echo "- **APK:** \`negai.apk\` (${APK_SIZE})"
          } >> "$GITHUB_STEP_SUMMARY"
